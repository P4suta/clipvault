# CodeQL static analysis for C# (defense-in-depth on top of the in-build analyzers).
# Manual build-mode: CodeQL traces the real `just build` so it sees all four projects' compilation.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # weekly, Monday 04:23 UTC

permissions: {}

env:
  CI: "true"

jobs:
  analyze:
    # Windows is required to build the net10.0-windows + WinUI projects that CodeQL traces.
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write # required to upload the SARIF results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: csharp
          build-mode: manual

      - name: Build (traced by CodeQL)
        run: mise exec -- just build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
