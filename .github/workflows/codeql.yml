# CodeQL static analysis for C# (defense-in-depth on top of the in-build analyzers).
# Manual build-mode: CodeQL traces the real `just build` so it sees all four projects' compilation.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # weekly, Monday 04:23 UTC

permissions: {}

env:
  CI: "true"

jobs:
  analyze:
    # Windows is required to build the net10.0-windows + WinUI projects that CodeQL traces.
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write # required to upload the SARIF results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: csharp
          build-mode: manual

      - name: Build (traced by CodeQL)
        run: mise exec -- just build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
