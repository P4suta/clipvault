# Build an unsigned preview from main on manual request.
# Upload the channel-stamped bundle as a 14-day Actions artifact.
# Preview data stays in %LOCALAPPDATA%\ClipVault\nightly.
name: nightly

on:
  workflow_dispatch: {}

# Deny by default; the single job only reads the repo (upload-artifact uses the runtime token).
permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    name: Build requested preview
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute nightly channel
        id: chan
        shell: bash
        run: |
          set -euo pipefail
          date="$(date -u +%Y%m%d)"
          echo "channel=nightly.$date" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Restore (locked)
        run: mise exec -- just restore-locked

      # Build the unsigned ClipVault/ bundle stamped with the nightly channel (app body + launcher).
      - name: Publish nightly bundle
        shell: bash
        env:
          CHANNEL: ${{ steps.chan.outputs.channel }}
        run: mise exec -- just publish "$CHANNEL"

      # Zip the bundle (minus PDBs) and checksum it, mirroring the release asset shape.
      - name: Stage nightly artifact
        shell: bash
        env:
          CHANNEL: ${{ steps.chan.outputs.channel }}
        run: |
          set -euo pipefail
          v="$(mise exec -- just version "$CHANNEL")"
          mkdir -p artifacts/release
          ( cd artifacts/publish && 7z a -tzip '-xr!*.pdb' \
              "$GITHUB_WORKSPACE/artifacts/release/ClipVault-$v-win-x64.zip" ClipVault >/dev/null )
          ( cd artifacts/release && sha256sum -- * > SHA256SUMS.txt )
          ls -la artifacts/release

      - name: Upload nightly artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clipvault-nightly
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14
