# Manual preview: an UNSIGNED, channel-stamped bundle from main, published as a 14-day GitHub Actions artifact (NOT a Release) so nightlies stay off the Releases list and out of the immutable-release flow.
# The approval-gated signing pipeline is stable-only (see release.yml); nightly testers accept the SmartScreen warning.
# A nightly build isolates its own data under %LOCALAPPDATA%\ClipVault\nightly.
name: nightly

on:
  workflow_dispatch: {}

# Deny by default; the single job only reads the repo (upload-artifact uses the runtime token).
permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    name: Build requested preview
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Compute nightly channel
        id: chan
        shell: bash
        run: |
          set -euo pipefail
          date="$(date -u +%Y%m%d)"
          echo "channel=nightly.$date" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Restore (locked)
        run: mise exec -- just restore-locked

      # Build the unsigned ClipVault/ bundle stamped with the nightly channel (app body + launcher).
      - name: Publish nightly bundle
        shell: bash
        env:
          CHANNEL: ${{ steps.chan.outputs.channel }}
        run: mise exec -- just publish "$CHANNEL"

      # Zip the bundle (minus PDBs) and checksum it, mirroring the release asset shape.
      - name: Stage nightly artifact
        shell: bash
        env:
          CHANNEL: ${{ steps.chan.outputs.channel }}
        run: |
          set -euo pipefail
          v="$(mise exec -- just version "$CHANNEL")"
          mkdir -p artifacts/release
          ( cd artifacts/publish && 7z a -tzip '-xr!*.pdb' \
              "$GITHUB_WORKSPACE/artifacts/release/ClipVault-$v-win-x64.zip" ClipVault >/dev/null )
          ( cd artifacts/release && sha256sum -- * > SHA256SUMS.txt )
          ls -la artifacts/release

      - name: Upload nightly artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clipvault-nightly
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14
