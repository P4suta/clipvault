# Lint, build, analyze, test, and audit dependencies on pull requests and merge groups.
# Mirrors the local `just` flow so CI and developer machines share one source of truth.
name: ci

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

# Deny by default at the workflow scope; the one job grants only what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true" # enables ContinuousIntegrationBuild (deterministic source paths) via Directory.Build.props

jobs:
  build-test:
    name: Verify Windows
    # Windows is required: the app targets net10.0-windows + WinUI 3 (Windows App SDK).
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read # only needs to read the repository
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history so `committed` can lint the PR commit range
          persist-credentials: false # no pushes; do not leave the token in .git/config

      # Installs the pinned toolchain from mise.toml (dotnet, just, typos, actionlint, committed) and activates it.
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Install text linters (yamllint, markdownlint-cli2)
        run: |
          pip install --disable-pip-version-check --require-hashes -r .ci/linters/requirements.txt
          npm ci --prefix .ci/linters --ignore-scripts

      # Conventional Commits gate on the PR's commit range (squash-merge uses the PR title; this also
      # catches non-conforming commits early).
      - name: Lint commit messages (Conventional Commits)
        # Renovate's generated dependency subjects may exceed the 50-character human-commit limit, so its pull requests use the reviewed squash title instead.
        if: github.event_name == 'pull_request' && github.actor != 'renovate[bot]'
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: mise exec -- committed "${BASE}..${HEAD}" --no-merge-commit

      # Enforce the committed lockfiles (fails closed if packages.lock.json drifts).
      - name: Restore (locked)
        run: mise exec -- just restore-locked

      - name: Format check
        run: mise exec -- just fmt-check

      - name: Spell check
        run: mise exec -- just typos

      - name: Analyze (analyzers, warnings as errors)
        run: mise exec -- just analyze

      - name: Lint workflows (actionlint)
        run: mise exec -- just actionlint

      - name: Lint YAML (yamllint)
        run: mise exec -- just yamllint

      - name: Lint Markdown (markdownlint)
        shell: bash
        run: PATH="$PWD/.ci/linters/node_modules/.bin:$PATH" mise exec -- just markdownlint

      - name: Strict-code gate
        run: mise exec -- just strict-code

      - name: Test and coverage gate
        run: mise exec -- just coverage-check

      - name: Dependency vulnerability audit
        run: mise exec -- just audit

  # The one status check branch protection requires,
  # named the same in every P4suta repository.
  # It passes only when the Windows check succeeds.
  required:
    name: required
    if: always()
    needs: [build-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the Windows check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "${RESULTS}"
          jq -e '."build-test".result == "success"' <<< "${RESULTS}"
