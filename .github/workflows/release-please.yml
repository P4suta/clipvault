# Release proposals and drafts follow docs/adr/0008-build-channels-and-release-please.md.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: >-
      github.repository_id == '1273122871' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The credential boundary follows docs/adr/sync-release-app-credentials-to-the-protected-environment.md.
    environment: release-please
    permissions:
      contents: read # The App token authorizes release proposals and drafts.
      actions: write # dispatch release.yml once the draft Release is created
    env:
      HAS_APP: >-
        ${{ secrets.RELEASE_PLEASE_CLIENT_ID != '' ||
        secrets.RELEASE_PLEASE_PRIVATE_KEY != '' }}
      APP_INPUTS_VALID: >-
        ${{ secrets.RELEASE_PLEASE_CLIENT_ID != '' &&
        !startsWith(secrets.RELEASE_PLEASE_CLIENT_ID, '${') &&
        secrets.RELEASE_PLEASE_PRIVATE_KEY != '' &&
        !startsWith(secrets.RELEASE_PLEASE_PRIVATE_KEY, '${') }}
    steps:
      - name: Reject missing or unresolved automation credentials
        if: env.HAS_APP == 'true' && env.APP_INPUTS_VALID != 'true'
        shell: bash
        run: exit 1

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.HAS_APP == 'true'
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: clipvault
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        if: env.HAS_APP == 'true'
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Drafts require explicit dispatch under docs/adr/0008-build-channels-and-release-please.md.
      - name: Trigger the signed-release build
        if: ${{ env.HAS_APP == 'true' && steps.rp.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.rp.outputs.tag_name }}
          SHA: ${{ steps.rp.outputs.sha }}
        run: |
          gh workflow run release.yml --repo "$REPO" --ref main \
            -f tag_name="$TAG" -f sha="$SHA" -f publish=true

      - name: release-please (dormant — App not configured)
        if: env.HAS_APP != 'true'
        run: |
          echo "::notice::release-please is dormant — set RELEASE_PLEASE_CLIENT_ID and"
          echo "RELEASE_PLEASE_PRIVATE_KEY (a GitHub App) in the release-please environment to activate."
          echo "See docs/RELEASING.md and ADR-0008."
